services:
  multica-dingding:
    build:
      context: .
      args:
        # 国内网络镜像加速（按需修改/移除）
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        MULTICA_DOWNLOAD_URL: ${MULTICA_DOWNLOAD_URL:-https://github.com/multica-ai/multica/releases/download}
        # docker hub 拉不动时换基础镜像源，如 docker.m.daocloud.io/library/python:3.12-slim
        PYTHON_BASE: ${PYTHON_BASE:-python:3.12-slim}
    image: multica-dingding-service:latest
    container_name: multica-dingding
    restart: unless-stopped
    ports:
      - "8300:8300"
    volumes:
      # 配置（config.yaml + multica 认证）—— 修改后 docker compose restart 生效
      - ./config:/app/config:ro
      # multica CLI 认证目录（含 profiles/<profile>/config.json 的 token），挂为容器 HOME 下
      - ./config/multica-home:/home/multica/.multica
      # 会话数据库 —— 重启不丢
      - ./data:/app/data
      # 日志 —— 落在宿主机
      - ./logs:/app/logs
    environment:
      MDS_MULTICA_PROFILE: ${MDS_MULTICA_PROFILE:-desktop-api.multica.ai}
      MDS_MULTICA_SERVER_URL: ${MDS_MULTICA_SERVER_URL:-}
      MDS_MULTICA_WORKSPACE_ID: ${MDS_MULTICA_WORKSPACE_ID:-}
      MDS_MULTICA_AGENT_ID: ${MDS_MULTICA_AGENT_ID:-}
      # 别名表（JSON 对象字符串，见 .env.example；空 = 不启用）
      MDS_MULTICA_WORKSPACES: ${MDS_MULTICA_WORKSPACES:-}
      MDS_MULTICA_AGENTS: ${MDS_MULTICA_AGENTS:-}
      MDS_DINGTALK_CLIENT_ID: ${MDS_DINGTALK_CLIENT_ID:-}
      MDS_DINGTALK_CLIENT_SECRET: ${MDS_DINGTALK_CLIENT_SECRET:-}
      MDS_API_KEY: ${MDS_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8300/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
